<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Contact Form</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar navbar-dark bg-dark">
        <div class="container d-flex flex-wrap gap-3">
            <a class="nav-link text-white" href="index.html">Contact</a>
            <a class="nav-link text-white" href="validation.html">HTML5 Validation</a>
            <a class="nav-link text-white" href="bootstrap-form.html">Bootstrap Form</a>
            <a class="nav-link text-white" href="bootstrap-validation.html">Bootstrap Validation</a>
            <a class="nav-link text-white" href="registration.html">Registration</a>
        </div>
    </nav>

    <main class="container my-5">
        <h1>Bootstrap Contact Form</h1>
        <p class="text-muted">Fill in the form to contact us.</p>

        <form method="get" class="row g-3">
            <div class="col-md-6">
                <label for="name" class="form-label">Name</label>
                <input
                    type="text"
                    class="form-control"
                    id="name"
                    name="name"
                    placeholder="Enter your name"
                    required
                >
            </div>

            <div class="col-md-6">
                <label for="email" class="form-label">Email</label>
                <input
                    type="email"
                    class="form-control"
                    id="email"
                    name="email"
                    placeholder="name@example.com"
                    aria-describedby="emailHelp"
                    required
                >
                <div id="emailHelp" class="form-text">
                    We will never share your email.
                </div>
            </div>

            <div class="col-12">
                <label for="message" class="form-label">Message</label>
                <textarea
                    class="form-control"
                    id="message"
                    name="message"
                    rows="5"
                    placeholder="Write your message here"
                    required
                ></textarea>
            </div>

            <div class="col-12">
                <button type="submit" class="btn btn-primary">
                    Send Message
                </button>
            </div>
        </form>
    </main>

</body>
</html>
